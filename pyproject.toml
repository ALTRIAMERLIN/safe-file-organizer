[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-file-organizer"
version = "1.0.0"
description = "Safe File Organizer: preview-first batch file renaming/sorting with undo (Windows)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
fileorganizer = "fileorganizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["windows: requires real Windows"]
